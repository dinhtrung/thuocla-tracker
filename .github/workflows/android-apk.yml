name: Android APK

# Builds the native app in android/ on a GitHub runner.
#
# - push/PR touching android/** -> unit tests + debug APK artifact (no secrets needed)
# - push a tag (v*)            -> signed release APK attached to the GitHub Release
#
# Signing reuses the four Gradle properties the local build already reads
# (thuoclaStoreFile / thuoclaStorePassword / thuoclaKeyAlias / thuoclaKeyPassword), fed from repo
# secrets, so the keystore never enters git. If a secret is missing the tag job fails loudly —
# an unsigned APK cannot be sideloaded over the app already installed on the phone.
on:
  workflow_dispatch:
    inputs:
      variant:
        description: "debug hoặc release"
        type: choice
        options: [debug, release]
        default: debug
  push:
    tags: ["v*", "android-v*"]
    # main is what the APK is cut from — build it there too, or a broken main goes unnoticed
    # until someone tags.
    branches: [main]
    paths:
      - "android/**"
      - "scripts/verify-web-assets.sh"
      - ".github/workflows/android-apk.yml"

  pull_request:
    paths: ["android/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

env:
  # The runner image ships the SDK here; be explicit so aapt2/apksigner always resolve.
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  apk:
    # Pin 24.04 on purpose: ubuntu-latest moved to 26.04 (Oct–Nov 2026) and its DEFAULT JDK is 25,
    # which AGP 8.7.3 rejects. setup-java below still forces 17.
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      # Robolectric downloads `android-all-instrumented` jars (~350 MB) from Maven Central at test
      # time, through its own HTTP client — not through Gradle, so setup-gradle's cache does not
      # cover it and `--offline` does not stop it. When that fetch fails the run reports 100+
      # test failures with `MavenArtifactFetcher`/`HttpURLConnection` and no test body ran (issue
      # #58: 102/164 on PR #56, 162 on main 86fad58). Caching the directory removes the steady-state
      # download; the key carries the Robolectric version so a bump invalidates it automatically.
      - name: Cache Robolectric android-all jars
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/robolectric
          key: robolectric-android-all-${{ runner.os }}-${{ hashFiles('android/gradle/libs.versions.toml') }}
          restore-keys: |
            robolectric-android-all-${{ runner.os }}-

      # Runs for BOTH paths (debug and release/tag): a drifted asset copy must red the job.
      # The job defaults to working-directory: android, but the script lives at the repo root,
      # so this step overrides it back to '.'.
      - name: Verify web assets match the web build at repo root
        working-directory: .
        run: bash scripts/verify-web-assets.sh

      # ---- debug path: every PR / push / manual dispatch -------------------------------
      - name: Unit tests + debug build
        if: github.ref_type != 'tag'
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug
          status=$?
          # Both resolvers mean the same thing: the android-all jar was not available. MavenArtifactFetcher
          # is the download path CI hits; LocalDependencyResolver is the same failure when a dependency
          # dir is configured. Either way no test body ran (issue #58).
          if [ "$status" -ne 0 ] && grep -rqsE 'MavenArtifactFetcher|LocalDependencyResolver|Could not (resolve|fetch) android-all' app/build/test-results/testDebugUnitTest/; then
            echo "::error::Robolectric could not download its android-all jars — this is an infrastructure failure, NOT a test failure. Every failing test above failed before its body ran. Fix: re-run the job; the ~/.m2/repository/org/robolectric cache makes it a no-op once warm. See issue #58."
          fi
          exit "$status"

      - name: Verify debug APK (must not request INTERNET)
        if: github.ref_type != 'tag'
        run: |
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK=app/build/outputs/apk/debug/app-debug.apk
          "$AAPT2" dump badging "$APK" | grep -E '^(package|application:|application-icon|sdkVersion|targetSdkVersion)'
          "$AAPT2" dump permissions "$APK"
          if "$AAPT2" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::APK xin quyền INTERNET — app này phải offline hoàn toàn"; exit 1
          fi

      - name: Upload debug APK
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@v4
        with:
          name: thuocla-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ---- release path: tags and manual release dispatch -------------------------------
      - name: Restore keystore from secrets
        if: github.ref_type == 'tag' || inputs.variant == 'release'
        env:
          KEYSTORE_BASE64: ${{ secrets.THUOCLA_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.THUOCLA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.THUOCLA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.THUOCLA_KEY_PASSWORD }}
        run: |
          missing=""
          [ -n "$KEYSTORE_BASE64" ]   || missing="$missing THUOCLA_KEYSTORE_BASE64"
          [ -n "$KEYSTORE_PASSWORD" ] || missing="$missing THUOCLA_KEYSTORE_PASSWORD"
          [ -n "$KEY_ALIAS" ]         || missing="$missing THUOCLA_KEY_ALIAS"
          [ -n "$KEY_PASSWORD" ]      || missing="$missing THUOCLA_KEY_PASSWORD"
          if [ -n "$missing" ]; then
            echo "::error::Thiếu secret:$missing — release phải ký bằng đúng khoá của bản đang cài trên máy."; exit 1
          fi
          mkdir -p "$HOME/keystores"
          echo "$KEYSTORE_BASE64" | base64 -d > "$HOME/keystores/thuocla-release.jks"
          {
            echo "thuoclaStoreFile=$HOME/keystores/thuocla-release.jks"
            echo "thuoclaStorePassword=$KEYSTORE_PASSWORD"
            echo "thuoclaKeyAlias=$KEY_ALIAS"
            echo "thuoclaKeyPassword=$KEY_PASSWORD"
          } >> "$HOME/.gradle/gradle.properties"

      - name: Unit tests + signed release build
        if: github.ref_type == 'tag' || inputs.variant == 'release'
        run: |
          set +e
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleRelease
          status=$?
          # Both resolvers mean the same thing: the android-all jar was not available. MavenArtifactFetcher
          # is the download path CI hits; LocalDependencyResolver is the same failure when a dependency
          # dir is configured. Either way no test body ran (issue #58).
          if [ "$status" -ne 0 ] && grep -rqsE 'MavenArtifactFetcher|LocalDependencyResolver|Could not (resolve|fetch) android-all' app/build/test-results/testDebugUnitTest/; then
            echo "::error::Robolectric could not download its android-all jars — infrastructure failure, NOT a test failure. Re-run the job; see issue #58."
            exit "$status"
          fi
          [ "$status" -eq 0 ] || exit "$status"
          AAPT2="$ANDROID_HOME/build-tools/35.0.0/aapt2"
          APK=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "::error::Không có $APK — Gradle chỉ tạo bản unsigned (thiếu khoá ký)"; ls -l app/build/outputs/apk/release/; exit 1
          fi
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$APK"
          "$AAPT2" dump badging "$APK" | grep -E '^(package|application:)'
          if "$AAPT2" dump permissions "$APK" | grep -q 'android.permission.INTERNET'; then
            echo "::error::APK release xin quyền INTERNET"; exit 1
          fi

      - name: Name APK after the tag
        if: github.ref_type == 'tag'
        run: |
          # android-v1.0.0 -> thuocla-v1.0.0.apk (same naming as the local build)
          cp app/build/outputs/apk/release/app-release.apk "thuocla-${GITHUB_REF_NAME#android-}.apk"

      - name: Attach APK to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: android/thuocla-*.apk
          fail_on_unmatched_files: true
          generate_release_notes: true
